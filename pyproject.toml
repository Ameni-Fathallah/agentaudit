[project]
name = "agentaudit"
version = "0.1.0"
description = "Plateforme multi-agents d'audit de sécurité et de fiabilité des agents IA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.6.2",
    "pydantic-settings>=2.15.0",
    "faker>=40.39.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
